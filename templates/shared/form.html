{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-3"><h2>{{ page_title }}</h2><a class="btn btn-outline-secondary" href="{{ cancel_url }}">Back</a></div><div class="card p-4"><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-primary">Save record</button></form></div>{% endblock %}
