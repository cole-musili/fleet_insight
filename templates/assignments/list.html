{% extends "base.html" %}{% block content %}<div class="d-flex flex-wrap justify-content-between mb-3"><h2>Driver–Truck Assignments</h2><a class="btn btn-primary" href="{% url 'assignments_add' %}">Add assignment</a></div><form class="row g-2 mb-3"><div class="col"><input class="form-control" name="q" value="{{ q }}" placeholder="Search driver or truck"></div><div class="col-auto"><button class="btn btn-outline-primary">Search</button></div></form><div class="card p-3 table-responsive"><table class="table"><thead><tr><th>Driver</th><th>Truck</th><th><a href="?sort=date_from">From</a></th><th>Until</th><th>Actions</th></tr></thead><tbody>{% for r in records %}<tr><td>{{ r.driver }}</td><td>{{ r.truck }}</td><td>{{ r.date_from }}</td><td>{{ r.date_until|default:'Ongoing' }}</td><td><a href="{% url 'assignments_edit' r.pk %}">Edit</a> · <a href="{% url 'assignments_delete' r.pk %}">Delete</a></td></tr>{% empty %}<tr><td colspan="5">No assignments found.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
